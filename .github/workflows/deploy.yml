# Builds the site from src/ and publishes it to GitHub Pages on every push to main.
# The built files (data/, the prerendered pages, sitemap.xml) are not committed; see README.md.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: pip install opencc-python-reimplemented==0.1.7
      - run: npm ci --prefix tools
      - run: python tools/build.py
      - run: node tools/pinyin.mjs
      - run: node tools/site.mjs   # Chrome comes with the runner
      # publish the site only, not its sources and tools
      - run: rsync -a --exclude='.*' --exclude=_site --exclude=src --exclude=tools --exclude='*.md' ./ _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
